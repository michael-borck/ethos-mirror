name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:core

      # Custom domain (ethosmirror.eduserver.au) serves from the root,
      # so build with base '/' (was '/ethos-mirror/' for the github.io subpath).
      - name: Build web app for Pages
        run: npm run build --workspace packages/web -- --base=/

      # SPA fallback: Pages serves 404.html for unknown paths, so deep links
      # like /app/interview load the app and the router takes over.
      - run: cp packages/web/dist/index.html packages/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
